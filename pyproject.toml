[project]
name = "briefai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.139,<1",
  "pydantic-settings>=2.10,<3",
  "google-genai>=2.13,<3",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
